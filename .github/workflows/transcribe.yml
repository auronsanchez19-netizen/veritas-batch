name: transcribe

# Transcribe audio o el audio de un vídeo en un runner de 16 GB y devuelve el
# texto al Worker.
#
# NO sube artefactos con material del usuario: este repo es público y un
# artefacto lo puede descargar cualquiera con una cuenta de GitHub. El texto sale
# por POST firmado al endpoint interno (`/internal/workspace/result`) y el Worker
# lo guarda como archivo del workspace del dueño.
#
# El enlace de descarga es firmado, caduca en minutos y sirve una sola vez.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [veritas-transcribe]

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar firma del despacho
        env:
          VERITAS_DISPATCH_SECRET: ${{ secrets.VERITAS_DISPATCH_SECRET }}
          SIGNATURE: ${{ github.event.client_payload.sig }}
          NONCE: ${{ github.event.client_payload.nonce }}
          PAYLOAD: ${{ toJSON(github.event.client_payload.body) }}
        run: python3 scripts/verify_signature.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper==1.2.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Transcribir y devolver el texto
        env:
          MEDIA_URL: ${{ github.event.client_payload.body.audio_url }}
          RESULT_URL: ${{ github.event.client_payload.body.result_url }}
          JOB: ${{ github.event.client_payload.body.job }}
          FILENAME: ${{ github.event.client_payload.body.filename }}
          USER_ID: ${{ github.event.client_payload.body.user_id }}
          MODEL: ${{ github.event.client_payload.body.model }}
          LANGUAGE: ${{ github.event.client_payload.body.language }}
        run: python3 scripts/media_to_workspace.py

      - name: Limpiar restos
        if: always()
        run: rm -rf /tmp/veritas-media-*
