name: transcribe

# Transcripción con faster-whisper. Aquí sí hay RAM para un modelo mediano:
# 16 GB frente a los 512 MB de Sandboxd/Faable/Apply.Build, donde no cabe.
#
# El audio entra por URL pública y el resultado sale como artefacto. El repo es
# público: NO pasar material sensible por esta vía.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [veritas-transcribe]

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verificar firma del despacho
        env:
          VERITAS_DISPATCH_SECRET: ${{ secrets.VERITAS_DISPATCH_SECRET }}
          SIGNATURE: ${{ github.event.client_payload.sig }}
          NONCE: ${{ github.event.client_payload.nonce }}
          PAYLOAD: ${{ toJSON(github.event.client_payload.body) }}
        run: python3 scripts/verify_signature.py

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper==1.2.0

      - name: Transcribir
        env:
          AUDIO_URL: ${{ github.event.client_payload.body.audio_url }}
          MODEL: ${{ github.event.client_payload.body.model }}
          LANGUAGE: ${{ github.event.client_payload.body.language }}
        run: python3 scripts/transcribe.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: transcription
          path: out/
          if-no-files-found: warn
          retention-days: 7
