name: ais

# Sondeo AIS desde IP propia. Existe porque Render comparte IP de salida y
# aisstream limita a 3 conexiones por IP: desde allí el handshake se rechaza.
#
# Sin secretos en la carga ni en artefactos: la clave de aisstream y el secreto
# del ingest viven en Actions secrets y el resultado se envía por HTTPS a
# Véritas. Este repo es público; aquí sólo hay código.

on:
  workflow_dispatch: {}
  # El cron del Worker de Véritas lo dispara cuando la foto tiene más de 20 min.
  # Es el disparo fiable: el `schedule` de GitHub llegó a saltarse tres ventanas
  # seguidas el 2026-11-11.
  repository_dispatch:
    types: [veritas-ais]
  schedule:
    # Se mantiene como respaldo; si GitHub lo cumple, el del Worker no dispara
    # porque la foto ya estará fresca.
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: ais-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Sólo los despachos llevan firma; el cron y el disparo manual no.
      - name: Verificar firma del despacho
        if: github.event_name == 'repository_dispatch'
        env:
          VERITAS_DISPATCH_SECRET: ${{ secrets.VERITAS_DISPATCH_SECRET }}
          SIGNATURE: ${{ github.event.client_payload.sig }}
          NONCE: ${{ github.event.client_payload.nonce }}
          PAYLOAD: ${{ toJSON(github.event.client_payload.body) }}
        run: python3 scripts/verify_signature.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Instalar cliente WebSocket
        run: python3 -m pip install --quiet "websockets==13.1"

      - name: Sondear y publicar la instantánea
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_INGEST_URL: ${{ secrets.AIS_INGEST_URL }}
          AIS_INGEST_SECRET: ${{ secrets.AIS_INGEST_SECRET }}
        run: python3 scripts/ais_poll.py
