name: documents

# PDF -> Markdown con docling y marker. Depende de torch (~1,7 GB): no cabe en
# ningún carril de 512 MB. Es el motivo de que este workflow exista.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [veritas-documents]

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar firma del despacho
        env:
          VERITAS_DISPATCH_SECRET: ${{ secrets.VERITAS_DISPATCH_SECRET }}
          SIGNATURE: ${{ github.event.client_payload.sig }}
          NONCE: ${{ github.event.client_payload.nonce }}
          PAYLOAD: ${{ toJSON(github.event.client_payload.body) }}
        run: python3 scripts/verify_signature.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install docling==2.68.0

      - name: Convertir
        env:
          DOCUMENT_URL: ${{ github.event.client_payload.body.document_url }}
          TOOL: ${{ github.event.client_payload.body.tool }}
        run: python3 scripts/parse_document.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: document
          path: out/
          if-no-files-found: warn
          retention-days: 7
