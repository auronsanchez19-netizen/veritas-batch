name: vm

# VM de propósito general para Véritas: pruebas, respaldo del sandbox y
# verificación. 4 vCPU / 16 GB / 6 h por job, gratis por ser repo público.
#
# Disparo: repository_dispatch con event_type = veritas-vm.
# Firma obligatoria: scripts/verify_signature.py la comprueba antes de que el job
# ejecute NADA del llamante. Va despues del checkout porque el script vive en el
# repo; el checkout no toca la carga (primer intento fallo por ponerlo antes: el
# fichero no existia en el runner).

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [veritas-vm]

permissions:
  contents: read

concurrency:
  group: vm-${{ github.event.client_payload.trace_id || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar firma del despacho
        env:
          VERITAS_DISPATCH_SECRET: ${{ secrets.VERITAS_DISPATCH_SECRET }}
          SIGNATURE: ${{ github.event.client_payload.sig }}
          NONCE: ${{ github.event.client_payload.nonce }}
          PAYLOAD: ${{ toJSON(github.event.client_payload.body) }}
        run: python3 scripts/verify_signature.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Entorno base (stack de datos y herramientas)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pandas scipy scikit-learn matplotlib openpyxl \
            python-docx python-pptx reportlab pypdf requests beautifulsoup4 lxml pillow
          echo "== versiones =="
          python3 -c "import numpy,pandas,scipy,sklearn;print('numpy',numpy.__version__,'pandas',pandas.__version__,'scipy',scipy.__version__,'sklearn',sklearn.__version__)"
          nproc; free -g | head -2; df -h / | tail -1; python3 -V; node -v || true

      - name: Paquetes extra pedidos por el llamante
        env:
          EXTRA: ${{ join(github.event.client_payload.body.packages, ' ') }}
        run: |
          if [ -n "$EXTRA" ]; then
            echo "instalando: $EXTRA"
            python3 -m pip install $EXTRA
          else
            echo "sin paquetes extra"
          fi

      - name: Ejecutar comandos
        env:
          COMMANDS: ${{ toJSON(github.event.client_payload.body.commands) }}
          TIMEOUT_S: ${{ github.event.client_payload.body.timeout_s }}
        run: python3 scripts/run_commands.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vm-result
          path: out/
          if-no-files-found: warn
          retention-days: 7
