name: browser

# Chromium de verdad. Es el único carril con RAM para un navegador: Sandboxd y
# Faable (512 MB) no lo tienen, y está verificado que en Sandboxd no hay Chromium.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [veritas-browser]

permissions:
  contents: read

jobs:
  browse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verificar firma del despacho
        env:
          VERITAS_DISPATCH_SECRET: ${{ secrets.VERITAS_DISPATCH_SECRET }}
          SIGNATURE: ${{ github.event.client_payload.sig }}
          NONCE: ${{ github.event.client_payload.nonce }}
          PAYLOAD: ${{ toJSON(github.event.client_payload.body) }}
        run: python3 scripts/verify_signature.py

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Playwright + Chromium
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Navegar
        env:
          TARGET_URL: ${{ github.event.client_payload.body.url }}
          FULL_PAGE: ${{ github.event.client_payload.body.full_page }}
        run: python3 scripts/browse.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser
          path: out/
          if-no-files-found: warn
          retention-days: 7
